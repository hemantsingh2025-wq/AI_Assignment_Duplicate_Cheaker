<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assignment Duplicate Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="brand">
            <div class="logo">AI</div>
            <h1>Assignment Duplicate Checker</h1>
            <p>AI-powered handwritten assignment similarity detection</p>
        </div>

        <div class="login-card">

            <h2>College Login</h2>
            <p class="subtitle">Sign in with your college email to access the dashboard</p>

            <label>College Email</label>
            <input
                type="email"
                id="email"
                placeholder="name@college.edu.in"
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button onclick="login()">Login</button>

            <p id="message"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
